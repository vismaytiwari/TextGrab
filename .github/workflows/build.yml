name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swiftc --version

      - name: Build app
        run: make app

      - name: Verify app signature
        run: codesign --verify --deep --strict build.noindex/TextGrab.app
